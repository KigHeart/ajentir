[workspace]
resolver = "3"
members = [
    "crates/aj-core",
    "crates/aj-state",
    "crates/aj-kernel",
    "crates/aj-sim",
    "crates/aj-trading",
    "crates/aj-market-data",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/KigHeart/ajentir"

[workspace.dependencies]
assert_fs = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = "1"
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.10"
thiserror = "2"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "forbid"
todo = "forbid"
unimplemented = "forbid"
